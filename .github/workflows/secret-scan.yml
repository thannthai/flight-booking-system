name: Secret Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan history for committed secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Image pinned by digest so the result is reproducible; --redact keeps values out of the log.
      - name: Run gitleaks
        run: >
          docker run --rm -v "$PWD":/repo
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source /repo --redact --no-banner
