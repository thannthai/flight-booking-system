server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      show-details: never
      show-components: never

spring:
  config:
    import: classpath:demo-flight-templates.yaml
  application:
    name: backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flight_booking}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html


jwt:
  secret-key: ${JWT_SECRET}
  access-token-expiration: 900000 
  refresh-token-expiration: 604800000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}


cookie:
  secure: false

app:
  demo-flights:
    enabled: ${DEMO_FLIGHTS_ENABLED:false}
    allowed-jdbc-url: ${DEMO_FLIGHTS_ALLOWED_JDBC_URL:}
    window-days: ${DEMO_FLIGHTS_WINDOW_DAYS:30}
    interval-ms: ${DEMO_FLIGHTS_INTERVAL_MS:3600000}
    max-flights-per-day: ${DEMO_FLIGHTS_MAX_FLIGHTS_PER_DAY:12}
    max-window-seats: ${DEMO_FLIGHTS_MAX_WINDOW_SEATS:90000}
  booking:
    hold-ttl-seconds: 900

payos:
  client-id: ${PAYOS_CLIENT_ID}
  api-key: ${PAYOS_API_KEY}
  checksum-key: ${PAYOS_CHECKSUM_KEY}
  return-url: ${PAYOS_RETURN_URL:http://localhost:5173/payment/success}
  cancel-url: ${PAYOS_CANCEL_URL:http://localhost:5173/payment/cancel}
