server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      show-details: never
      show-components: never

spring:
  config:
    import: classpath:demo-flight-templates.yaml
  application:
    name: backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flight_booking}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    web:
      pageable:
        max-page-size: 100
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html


jwt:
  secret-key: ${JWT_SECRET}
  access-token-expiration: 900000 
  refresh-token-expiration: 604800000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}


cookie:
  secure: false

app:
  demo-flights:
    enabled: ${DEMO_FLIGHTS_ENABLED:false}
    allowed-jdbc-url: ${DEMO_FLIGHTS_ALLOWED_JDBC_URL:}
    window-days: ${DEMO_FLIGHTS_WINDOW_DAYS:30}
    interval-ms: ${DEMO_FLIGHTS_INTERVAL_MS:3600000}
    max-flights-per-day: ${DEMO_FLIGHTS_MAX_FLIGHTS_PER_DAY:12}
    max-window-seats: ${DEMO_FLIGHTS_MAX_WINDOW_SEATS:90000}
  payment:
    mode: ${PAYMENT_MODE:PAYOS}
    allowed-jdbc-url: ${DEMO_PAYMENT_ALLOWED_JDBC_URL:}
    accounts-enabled: ${DEMO_ACCOUNTS_ENABLED:false}
    account-password: ${DEMO_ACCOUNT_PASSWORD:}
  booking:
    hold-ttl-seconds: 900
    max-held-seats-per-user: 20
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Trusted reverse proxies in front of the backend (0 = use the socket address). Behind a proxy this MUST
    # be set, or every customer shares one counter. Verify the X-Forwarded-For chain on the deployed domain.
    trusted-proxy-hops: ${RATE_LIMIT_TRUSTED_PROXY_HOPS:0}
    # Shared with the Vercel frontend (RATE_LIMIT_PROXY_SECRET there too); 16+ random characters. Empty = off.
    proxy-secret: ${RATE_LIMIT_PROXY_SECRET:}
    login-failure-limit: 5
    login-failure-window-seconds: 900
    rules:
      - { name: login, path: /api/v1/auth/login, limit: 10, window-seconds: 60 }
      - { name: demo-login, path: /api/v1/demo/login/*, limit: 20, window-seconds: 60 }
      - { name: register, path: /api/v1/auth/register, limit: 5, window-seconds: 3600 }
      - { name: refresh, path: /api/v1/auth/refresh, limit: 30, window-seconds: 60 }
      - { name: hold-seats, path: /api/v1/bookings/hold-seats, scope: USER, limit: 30, window-seconds: 60 }

payos:
  client-id: ${PAYOS_CLIENT_ID}
  api-key: ${PAYOS_API_KEY}
  checksum-key: ${PAYOS_CHECKSUM_KEY}
  return-url: ${PAYOS_RETURN_URL:http://localhost:5173/payment/success}
  cancel-url: ${PAYOS_CANCEL_URL:http://localhost:5173/payment/cancel}

---
spring:
  config:
    activate:
      on-profile: "prod | production"
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

cookie:
  secure: ${COOKIE_SECURE:true}

# Public API documentation is off in production unless explicitly enabled.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

payos:
  return-url: ${PAYOS_RETURN_URL}
  cancel-url: ${PAYOS_CANCEL_URL}
