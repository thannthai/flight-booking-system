spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/flight_booking
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

springdoc:
  swagger-ui:
    path: /swagger-ui.html


jwt:
  secret-key: ${JWT_SECRET}
  access-token-expiration: 900000 
  refresh-token-expiration: 604800000

cors:
  allowed-origins: http://localhost:5173

cookie:
  secure: false

app:
  booking:
    hold-ttl-seconds: 900